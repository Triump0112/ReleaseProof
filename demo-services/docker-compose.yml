services:
  stable-latency:
    build: .
    environment:
      ROLE: stable
      SCENARIO: latency
    ports:
      - "8101:8080"
    healthcheck: &healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 3s
      timeout: 2s
      retries: 10

  candidate-latency:
    build: .
    environment:
      ROLE: candidate
      SCENARIO: latency
    ports:
      - "8102:8080"
    healthcheck: *healthcheck

  stable-contract:
    build: .
    environment:
      ROLE: stable
      SCENARIO: contract
    ports:
      - "8201:8080"
    healthcheck: *healthcheck

  candidate-contract:
    build: .
    environment:
      ROLE: candidate
      SCENARIO: contract
    ports:
      - "8202:8080"
    healthcheck: *healthcheck

