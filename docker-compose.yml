services:
  backend:
    build: ./backend
    environment:
      RELEASEPROOF_ALLOW_PRIVATE_TARGETS: "true"
      RELEASEPROOF_LEDGER_DIR: /data/runs
      RELEASEPROOF_USE_VERTEX: ${RELEASEPROOF_USE_VERTEX:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      RELEASEPROOF_GEMINI_MODEL: ${RELEASEPROOF_GEMINI_MODEL:-gemini-2.5-flash}
      # Demo revision URLs are runtime config, served to the UI by /api/demo-targets.
      RELEASEPROOF_STABLE_LATENCY_URL: http://stable-latency:8080
      RELEASEPROOF_CANDIDATE_LATENCY_URL: http://candidate-latency:8080
      RELEASEPROOF_STABLE_CONTRACT_URL: http://stable-contract:8080
      RELEASEPROOF_CANDIDATE_CONTRACT_URL: http://candidate-contract:8080
      RELEASEPROOF_STABLE_SIDEEFFECT_URL: http://stable-sideeffect:8080
      RELEASEPROOF_CANDIDATE_SIDEEFFECT_URL: http://candidate-sideeffect:8080
      RELEASEPROOF_STABLE_MONEY_URL: http://stable-money:8080
      RELEASEPROOF_CANDIDATE_MONEY_URL: http://candidate-money:8080
    ports:
      - "8000:8080"
    volumes:
      - releaseproof-data:/data/runs
    depends_on:
      stable-latency:
        condition: service_healthy
      candidate-latency:
        condition: service_healthy
      stable-contract:
        condition: service_healthy
      candidate-contract:
        condition: service_healthy
      stable-sideeffect:
        condition: service_healthy
      candidate-sideeffect:
        condition: service_healthy
      stable-money:
        condition: service_healthy
      candidate-money:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_ORIGIN: "http://backend:8080"
    ports:
      - "3000:8080"
    depends_on:
      - backend

  stable-latency:
    build: ./demo-services
    environment:
      ROLE: stable
      SCENARIO: latency
    ports:
      - "8101:8080"
    healthcheck: &demo-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 2s
      retries: 10

  candidate-latency:
    build: ./demo-services
    environment:
      ROLE: candidate
      SCENARIO: latency
    ports:
      - "8102:8080"
    healthcheck: *demo-health

  stable-contract:
    build: ./demo-services
    environment:
      ROLE: stable
      SCENARIO: contract
    ports:
      - "8201:8080"
    healthcheck: *demo-health

  candidate-contract:
    build: ./demo-services
    environment:
      ROLE: candidate
      SCENARIO: contract
    ports:
      - "8202:8080"
    healthcheck: *demo-health

  stable-sideeffect:
    build: ./demo-services
    environment:
      ROLE: stable
      SCENARIO: sideeffect
    ports:
      - "8301:8080"
    healthcheck: *demo-health

  candidate-sideeffect:
    build: ./demo-services
    environment:
      ROLE: candidate
      SCENARIO: sideeffect
    ports:
      - "8302:8080"
    healthcheck: *demo-health

  stable-money:
    build: ./demo-services
    environment:
      ROLE: stable
      SCENARIO: money
    ports:
      - "8401:8080"
    healthcheck: *demo-health

  candidate-money:
    build: ./demo-services
    environment:
      ROLE: candidate
      SCENARIO: money
    ports:
      - "8402:8080"
    healthcheck: *demo-health

volumes:
  releaseproof-data:

