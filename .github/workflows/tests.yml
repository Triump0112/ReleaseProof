name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend + demo services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -r demo-services/requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Demo service tests
        working-directory: demo-services
        run: python -m pytest -q

      - name: Live paired-service verification
        # Starts real stable/candidate processes and requires every seeded
        # regression to be blocked from measured evidence — including that the
        # baselines still pass where a scenario claims a blind spot.
        run: python scripts/verify_live_stack.py

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
